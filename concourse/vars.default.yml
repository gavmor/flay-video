# Non-secret, environment-specific config for concourse/pipeline.yml.
# Committed on purpose -- facts about *this* Concourse deployment's local
# network topology, not credentials. Load alongside the gitignored
# .secrets/vars.yml, which holds the actual secrets (this repo's own
# deploy key, the gpu-lock repo's key, MinIO access keys):
#
#   fly set-pipeline -p flay-video -c concourse/pipeline.yml \
#     -l concourse/vars.default.yml -l concourse/.secrets/vars.yml
#
# minio_endpoint/minio_bucket/gpu-lock are genuinely shared infra with
# gavmor/comfyui-workflows (blades68-lora) and gavmor/T2VA on this same
# box -- same self-hosted MinIO, same physical GPU, same Concourse
# instance (fly target `blades68`) -- not duplicated services, just
# reused via matching endpoint/bucket values.
minio_endpoint: http://192.168.16.1:9000
minio_bucket: blades68-crew-groups

# flay_raw_video_regexp / flay_source_name / flay_extract_fps: which
# staged source the extract-candidates job ingests. No meaningful
# default -- left pointed at the first real source (the Kanopy-Downloader
# "parts series") since that's what's actually staged in MinIO right now.
# Re-set the pipeline with different values to point at a new source.
flay_raw_video_regexp: frame-flay/raw-video/parts-series-(.*)\.tar\.gz
flay_source_name: parts-series
flay_extract_fps: "1/60"

# flay_candidate_regexp: which staged candidate-stills tarball flay-video
# consumes -- normally produced by extract-candidates above, matching
# flay_source_name.
flay_candidate_regexp: frame-flay/candidates/parts-series-candidates-(.*)\.tar\.gz

flay_min_cluster_size: 3
flay_min_samples: null

# flay_blur_threshold: the textbook variance-of-Laplacian threshold of 100
# assumes full-resolution, uncompressed frames. Measured directly against
# the real parts-series candidate stills (720p, JPEG-compressed by the
# ffmpeg extraction pass): median sharpness ~39, 95th percentile ~75 -- a
# threshold of 100 passed only 18/775 frames. 15 sits at the ~5th
# percentile of the actual distribution -- drops true outliers (near-zero
# variance, i.e. blank/transition frames) without gutting the pool
# HDBSCAN needs to find real clusters in. Recalibrate if a future
# source's resolution/compression differs meaningfully from this one.
flay_blur_threshold: 15.0
flay_dark_threshold: 15.0
flay_max_edge: 768

# flay_exhaustive_batch_size: decode+CLIP batch size for
# exhaustive-frame-flay's inline NVDEC->CV-CUDA->CLIP path. No production
# benchmark yet at this batch size against a real multi-hour corpus (the
# feasibility smoke test was single-frame-at-a-time on ~500 frames, not
# this script's real batched loop) -- validate against a short real clip
# before trusting this against a full multi-hour source, and revisit this
# value once real throughput numbers exist.
flay_exhaustive_batch_size: 16

# flay_exhaustive_max_frames: REQUIRED safety valve, not a tuning knob --
# see the KNOWN BLOCKING BUG note in flay_video_exhaustive.py and
# flay-pipeline.yml's exhaustive-frame-flay job comment. The script's
# current crash-avoidance workaround (a process-lifetime KEEPALIVE list
# that never releases GPU buffers) means memory usage grows without bound
# as more frames are processed. Only 24 frames have actually been verified
# end-to-end (real keyframes + manifest, no crash, no OOM) -- 500 here is
# an extrapolation from a rough per-frame VRAM estimate (~9MB/frame at
# 1080p => ~4.5GB for 500 frames, well under this box's 24GB), NOT itself
# directly measured. Verify real VRAM usage at whatever value you actually
# run before trusting it unattended, and do not set to 0 (uncapped)
# against a real multi-hour source until the upstream library bug is
# actually fixed.
flay_exhaustive_max_frames: 500
